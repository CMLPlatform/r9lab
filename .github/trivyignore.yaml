# Trivy allowlist for image vulnerability and IaC/config scans.
#
# Trivy's YAML ignore format is still experimental, so workflows pass this file
# explicitly. Every entry must include an expiry, a clear statement, and `paths` or
# `purls` (scripts/check_todo_dates.py): the file is shared by every image scan, and an
# unscoped id would also hide the finding in the backup and postgres images.
vulnerabilities:
  # TODO(drop-by 2027-01-14): re-check the caddy digest for golang.org/x/net 0.62.0, then drop this waiver or extend it
  # caddy:2-alpine (v2.11.9, re-scanned 2026-11-15) is built with Go 1.26.9 and carries the
  # go-jose fix; the five earlier Go, net/http, crypto/tls and go-jose waivers are gone. It
  # still links golang.org/x/net v0.60.0, fixed in 0.62.0. Re-check when the digest is bumped.
  - id: CVE-2026-78661
    paths: ["usr/bin/caddy"]
    expired_at: 2027-01-15
    statement: x/net/html quadratic-allocation DoS on crafted HTML; caddy here serves static files and never parses request-supplied HTML.

misconfigurations: []
secrets: []
licenses: []
